<header class="header">
  <div class="header-logo">
    <a href="#">
      <img src="assets/img/icons/logo.png" alt="Logo" />
    </a>
  </div>

  <nav class="nav-bar">
    <div class="nav-links">
      <a
        href="#aboutme"
        class="nav-item"
        [class.active]="activeSection === 'aboutme'"
        (click)="setActiveSection('aboutme')"
        >{{ 'navigation.aboutme' | translate }}</a
      >
      <a
        href="#skillset"
        class="nav-item"
        [class.active]="activeSection === 'skillset'"
        (click)="setActiveSection('skillset')"
        >{{ 'navigation.skillset' | translate }}</a
      >
      <a
        href="#mywork"
        class="nav-item"
        [class.active]="activeSection === 'mywork'"
        (click)="setActiveSection('mywork')"
        >{{ 'navigation.mywork' | translate }}</a
      >
    </div>

    <div class="lang-switch">
      <span
        class="lang-btn"
        (click)="switchLanguage('de')"
        [class.active]="translate.currentLang === 'de'"
        >DE</span
      >
      <span class="lang-sep">/</span>
      <span
        class="lang-btn"
        (click)="switchLanguage('en')"
        [class.active]="translate.currentLang === 'en' || !translate.currentLang"
        >EN</span
      >
    </div>
  </nav>

  <!-- Burger Menu Icon -->
  <div class="burger-menu" (click)="toggleMenu()" [class.open]="isMenuOpen">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Mobile Overlay -->
  <div class="mobile-overlay" *ngIf="isMenuOpen" (click)="closeMenu()">
    <div class="mobile-nav-links" (click)="$event.stopPropagation()">
      <a
        href="#aboutme"
        class="mobile-nav-item"
        [class.active]="activeSection === 'aboutme'"
        (click)="setActiveSection('aboutme'); closeMenu()"
        >{{ 'navigation.aboutme' | translate }}</a
      >
      <a
        href="#skillset"
        class="mobile-nav-item"
        [class.active]="activeSection === 'skillset'"
        (click)="setActiveSection('skillset'); closeMenu()"
        >{{ 'navigation.skillset' | translate }}</a
      >
      <a
        href="#mywork"
        class="mobile-nav-item"
        [class.active]="activeSection === 'mywork'"
        (click)="setActiveSection('mywork'); closeMenu()"
        >{{ 'navigation.mywork' | translate }}</a
      >

      <div class="mobile-lang-switch">
        <span
          class="lang-btn"
          (click)="switchLanguage('de'); closeMenu()"
          [class.active]="translate.currentLang === 'de'"
          >DE</span
        >
        <span class="lang-sep">/</span>
        <span
          class="lang-btn"
          (click)="switchLanguage('en'); closeMenu()"
          [class.active]="translate.currentLang === 'en' || !translate.currentLang"
          >EN</span
        >
      </div>
    </div>
  </div>
</header>

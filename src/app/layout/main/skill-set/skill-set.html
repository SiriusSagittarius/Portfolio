<section id="skillset" data-aos="fade-up" class="skillset">
  <div class="main">
    <h1>{{ 'skill.title' | translate }}</h1>
    <div class="skillset-row">
      <div class="skillset-div" *ngFor="let skill of skillIcons">
        <img [src]="getSkillIconPath(skill.icon)" alt="{{ skill.name }}" />
        <p>{{ skill.name }}</p>
      </div>
    </div>
  </div>
</section>

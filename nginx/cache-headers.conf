# Cache-Header für svenhaase.de
#
# In den server { ... }-Block der Seite einfügen (z. B. /etc/nginx/sites-available/svenhaase.de)
# oder die Datei nach /etc/nginx/snippets/ kopieren und dort per
#   include /etc/nginx/snippets/cache-headers.conf;
# einbinden. Bereits vorhandene location-Blöcke mit "expires" für js/css/woff2 vorher entfernen,
# sonst greift bei Regex-Locations der zuerst stehende Block.
#
# Achtung: add_header in einer location ersetzt alle add_header-Zeilen aus dem server-Block
# (z. B. Sicherheits-Header). Solche Header ggf. in jeder location hier wiederholen.
#
# Danach prüfen und neu laden:
#   sudo nginx -t && sudo systemctl reload nginx

# 1) Vom Angular-Build gehashte Dateien (main-3GX6D75O.js, chunk-…, styles-…, media/…-SJ4WYRLG.woff2):
#    Der Dateiname ändert sich bei jeder Inhaltsänderung, deshalb 1 Jahr + immutable.
location ~* "-[A-Z0-9]{8}\.(js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|avif|ico)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# 2) Ungehashte statische Dateien (Bilder und Icons unter /assets, favicon.ico):
#    Der Name bleibt bei Änderungen gleich, deshalb nur 30 Tage.
location ~* \.(woff2?|ttf|png|jpe?g|gif|svg|webp|avif|ico)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}

# 3) index.html, Übersetzungen (assets/i18n/*.json), llms.txt, robots.txt:
#    Immer beim Server nachfragen, damit ein neuer Deploy sofort ankommt.
location ~* \.(html|json|txt)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}
